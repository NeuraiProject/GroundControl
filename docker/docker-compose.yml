name: groundcontrol-neurai

services:
  # ─── Neurai full nodes (internal-only) ───────────────────────────────────
  neurai-mainnet:
    # Reuse the prebuilt release image from Docker Hub instead of building from
    # source. Its docker-entrypoint.sh runs `neuraid -datadir=/data` as the
    # unprivileged `neurai` user; we bind-mount our own neurai.conf there (RPC
    # 19001 + ZMQ 28332, matching the workers below) so the entrypoint keeps it
    # instead of generating one from NEURAI_* env vars.
    # https://hub.docker.com/r/neuraiproject/neurai-node/tags
    image: neuraiproject/neurai-node:v1.0.6
    container_name: groundcontrol-neurai-mainnet
    restart: unless-stopped
    # neuraid needs time to flush its databases on shutdown; killing it early
    # can force a long reindex on the next start.
    stop_grace_period: 5m
    volumes:
      - neurai_mainnet_data:/data
      - ./node-mainnet/neurai.conf:/data/neurai.conf:ro
    networks:
      - groundcontrol-neurai-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 10m

  neurai-testnet:
    # DePIN testnet (Neurai 2.0.0), built from the DePIN-Test branch.
    build: ./node-testnet
    container_name: groundcontrol-neurai-testnet
    restart: unless-stopped
    stop_grace_period: 5m
    volumes:
      - neurai_testnet_data:/data
    networks:
      - groundcontrol-neurai-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 10m

  # ─── MariaDB (internal-only) ─────────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: groundcontrol-neurai-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: groundcontrol
      MARIADB_USER: groundcontrol
      MARIADB_PASSWORD: secret
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - groundcontrol-neurai-net

  # ─── GroundControl HTTP API — THE ONLY SERVICE EXPOSING A HOST PORT ──────
  web:
    build: ..
    container_name: groundcontrol-neurai-web
    restart: unless-stopped
    depends_on:
      - mariadb
    env_file: ../.env
    environment:
      JAWSDB_MARIA_URL: mysql://groundcontrol:secret@mariadb:3306/groundcontrol
    command: npm start
    ports:
      - "3001:3001"
    networks:
      - groundcontrol-neurai-net

  # ─── Chain watchers: block + mempool per chain (internal-only) ───────────
  worker-blockprocessor-mainnet:
    build: ..
    container_name: groundcontrol-neurai-worker-block-mainnet
    restart: unless-stopped
    depends_on:
      - mariadb
      - neurai-mainnet
    env_file: ../.env
    environment:
      JAWSDB_MARIA_URL: mysql://groundcontrol:secret@mariadb:3306/groundcontrol
      NEURAI_RPC: http://neurai:changeme@neurai-mainnet:19001
      NEURAI_ZMQ: tcp://neurai-mainnet:28332
      CHAIN: mainnet
    command: npm run worker-blockprocessor
    networks:
      - groundcontrol-neurai-net

  worker-processmempool-mainnet:
    build: ..
    container_name: groundcontrol-neurai-worker-mempool-mainnet
    restart: unless-stopped
    depends_on:
      - mariadb
      - neurai-mainnet
    env_file: ../.env
    environment:
      JAWSDB_MARIA_URL: mysql://groundcontrol:secret@mariadb:3306/groundcontrol
      NEURAI_RPC: http://neurai:changeme@neurai-mainnet:19001
      NEURAI_ZMQ: tcp://neurai-mainnet:28332
      CHAIN: mainnet
    command: npm run worker-processmempool
    networks:
      - groundcontrol-neurai-net

  worker-blockprocessor-testnet:
    build: ..
    container_name: groundcontrol-neurai-worker-block-testnet
    restart: unless-stopped
    depends_on:
      - mariadb
      - neurai-testnet
    env_file: ../.env
    environment:
      JAWSDB_MARIA_URL: mysql://groundcontrol:secret@mariadb:3306/groundcontrol
      NEURAI_RPC: http://neurai:changeme@neurai-testnet:19101
      NEURAI_ZMQ: tcp://neurai-testnet:28332
      CHAIN: testnet
    command: npm run worker-blockprocessor
    networks:
      - groundcontrol-neurai-net

  worker-processmempool-testnet:
    build: ..
    container_name: groundcontrol-neurai-worker-mempool-testnet
    restart: unless-stopped
    depends_on:
      - mariadb
      - neurai-testnet
    env_file: ../.env
    environment:
      JAWSDB_MARIA_URL: mysql://groundcontrol:secret@mariadb:3306/groundcontrol
      NEURAI_RPC: http://neurai:changeme@neurai-testnet:19101
      NEURAI_ZMQ: tcp://neurai-testnet:28332
      CHAIN: testnet
    command: npm run worker-processmempool
    networks:
      - groundcontrol-neurai-net

  # ─── Chain-agnostic FCM/APNs dispatcher (internal-only) ──────────────────
  worker-sender:
    build: ..
    container_name: groundcontrol-neurai-worker-sender
    restart: unless-stopped
    depends_on:
      - mariadb
    env_file: ../.env
    environment:
      JAWSDB_MARIA_URL: mysql://groundcontrol:secret@mariadb:3306/groundcontrol
    command: npm run worker-sender
    networks:
      - groundcontrol-neurai-net

volumes:
  # Fresh volumes for the 1.0.6 mainnet image (datadir moved from /data/node to
  # /data, owned by the `neurai` user) and the reset DePIN testnet. The old
  # `mainnet_data` / `testnet_data` volumes are no longer used.
  neurai_mainnet_data:
  neurai_testnet_data:
  mariadb_data:

networks:
  groundcontrol-neurai-net:
    name: groundcontrol-neurai-net
    driver: bridge
