# Neurai MAINNET config — consumed by the prebuilt neuraiproject/neurai-node
# image. It is bind-mounted into the container at /data/node/neurai.conf, so the
# image's /node.sh entrypoint detects it already exists and runs neuraid against
# it instead of generating its own (which lacks ZMQ and uses different ports).
#
# Mirrors the config that the local-build node-mainnet/entrypoint.sh produced,
# minus `pubkeyindex` which the v1.0.5 release binary does not support.
testnet=0

# RPC — bound on 0.0.0.0 so other containers in the docker network can reach it.
# No host port is mapped in docker-compose, so it stays internal to the network.
rpcuser=neurai
rpcpassword=changeme
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=19101
rpcservertimeout=240
rpcworkqueue=64
rpcthreads=8
server=1

# Network — no inbound P2P, REST enabled
listen=0
rest=1

# Indexes — full
txindex=1
assetindex=1
addressindex=1
timestampindex=1
spentindex=1

# ZMQ — required by worker-blockprocessor / worker-processmempool (hashblock).
# Only reachable from the docker network (no host port mapped).
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28332
zmqpubhashblock=tcp://0.0.0.0:28332
zmqpubhashtx=tcp://0.0.0.0:28332

disablewallet=1
shrinkdebugfile=1
daemon=0
